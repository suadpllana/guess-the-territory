<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>thumb</title>
<style>
  @font-face { font-family: 'Lilita'; src: url('/node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { World } from '/src/geo/world.ts';
import { Renderer, drawPin, drawClouds, drawRipple } from '/src/map/renderer.ts';
import { flight, fitBox } from '/src/map/camera.ts';
import { themeById } from '/src/map/themes.ts';

const S = Number(new URLSearchParams(location.search).get('size') || 1080);
const canvas = document.getElementById('c');
canvas.width = S; canvas.height = S;
canvas.style.width = S + 'px'; canvas.style.height = S + 'px';
const ctx = canvas.getContext('2d');
const surf = { ctx, w: S, h: S, dpr: 1 };
const world = new World(null);
const r = new Renderer(world);
const theme = { ...themeById('classic'), water: '#8fcbff', land: '#fbf8f1', halo: 'rgba(255,255,255,0.6)', haloWidth: S * 0.012, border: '#b09bd0', borderWidth: S * 0.0018 };
const it = world.byCode.get('IT');
const vp = { x: 0, y: 0, w: S, h: S };
// Italy a little left of centre, leaving room for the bubble
const end = fitBox(it.frame, vp, 0.78, 0);
end.x += (it.frame[2] - it.frame[0]) * 0.1;
end.y -= (it.frame[3] - it.frame[1]) * 0.02;
const start = { x: end.x + 0.02, y: end.y + 0.02, z: end.z - 3.4 };
const path = flight(start, end, vp);
// pin tip in central Italy (Umbria) rather than the northern label point
const anchor = [(12.6 + 180) / 360, (() => { const la = 42.9 * Math.PI / 180; return 0.5 - Math.log(Math.tan(Math.PI / 4 + la / 2)) / (2 * Math.PI); })()];

let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const confetti = Array.from({ length: 70 }, () => ({
  a: rnd() * Math.PI * 2, v: 0.35 + rnd() * 0.65, s: 0.012 + rnd() * 0.012, c: ['#ff4757','#ffc93c','#2ed573','#1e90ff','#a55eea','#ff7f50'][Math.floor(rnd() * 6)], rot: rnd() * 6, sh: Math.floor(rnd() * 3),
}));

const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const clamp = (v) => Math.max(0, Math.min(1, v));
const toScreen = (view, x, y) => { const s = 2 ** view.z; return [S / 2 + (x - view.x) * s, S / 2 + (y - view.y) * s]; };

function bubble(x, y, rad, k, good) {
  if (k <= 0) return;
  const sc = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.25 * (1 - k) : 1;
  const e = Math.min(1, k * 1.6);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(e * sc, e * sc);
  ctx.shadowColor = 'rgba(20,30,60,0.35)'; ctx.shadowBlur = S * 0.03; ctx.shadowOffsetY = S * 0.012;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-rad * 0.55, rad * 0.62); ctx.lineTo(-rad * 0.95, rad * 1.18); ctx.lineTo(-rad * 0.08, rad * 0.92); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = rad * 0.1; ctx.strokeStyle = good ? '#1faa59' : '#ff4757';
  ctx.beginPath(); ctx.arc(0, 0, rad * 0.86, 0, Math.PI * 2); ctx.stroke();
  if (good) {
    ctx.strokeStyle = '#1faa59'; ctx.lineWidth = rad * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-rad * 0.4, 0); ctx.lineTo(-rad * 0.1, rad * 0.32); ctx.lineTo(rad * 0.45, -rad * 0.32); ctx.stroke();
  } else {
    ctx.fillStyle = '#ff4757'; ctx.font = `${rad * 1.35}px Lilita`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', rad * 0.02, rad * 0.08);
  }
  ctx.restore();
}

window.renderAt = (t) => {
  // timeline (s): fly 0-1.3, pin 1.3-1.75, bubble 1.8, correct 2.6
  const fk = clamp(t / 1.3);
  const view = path.at(easeIO(fk));
  r.drawBase(surf, view, vp, theme);
  const good = t >= 2.6;
  const since = t - 2.6;
  r.highlight(surf, view, vp, {
    feature: it,
    fill: good ? 'rgba(38,194,105,0.45)' : 'rgba(255,71,87,0.2)',
    stroke: good ? '#1faa59' : '#ff4757',
    width: S * 0.0055,
    dash: !good,
    dashOffset: t * 60,
    glow: good ? Math.max(0, 1 - since * 2) : 0.5 + 0.5 * Math.sin(t * 5),
  });
  const alt = Math.max(0, Math.min(1, Math.sin(fk * Math.PI) * 1.3 - 0.2));
  drawClouds(surf, view, alt);
  // pin
  const [px, py] = toScreen(view, anchor[0], anchor[1]);
  const size = S * 0.25;
  if (t >= 1.3) {
    const dt = t - 1.3;
    let drop = 0, squash = 1;
    if (dt < 0.3) { const k = dt / 0.3; drop = (1 - k * k) * size * 2.4; squash = 1.08; }
    else if (dt < 0.62) { const k = (dt - 0.3) / 0.32; drop = Math.sin(k * Math.PI) * size * 0.22; squash = 1 - 0.2 * Math.max(0, 1 - k * 3) + 0.05 * Math.sin(k * Math.PI); }
    if (good && since < 1.1) drop += Math.abs(Math.sin(since * Math.PI * 3)) * size * 0.25 * (1 - since / 1.1);
    if (dt > 0.3 && dt < 1.0) drawRipple(surf, px, py, 10 + ((dt - 0.3) / 0.7) * size, (1 - (dt - 0.3) / 0.7) * 0.8, '#ff4757');
    const blink = !good && t > 2.2 && t < 2.35 ? Math.sin(((t - 2.2) / 0.15) * Math.PI) : 0;
    drawPin(surf, px, py, size, drop, squash, theme, 1, good ? 'happy' : 'idle', blink, good ? 0 : Math.sin(t * 2.2) * 0.8);
  }
  // bubble with ? then check
  bubble(px + size * 0.95, py - size * 1.2, S * 0.1, clamp((t - 1.8) / 0.45), good);
  // confetti burst on correct
  if (good) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const c of confetti) {
      const d = since * c.v * S * 0.9;
      const x = px + Math.cos(c.a) * d;
      const y = py - size * 0.8 + Math.sin(c.a) * d + since * since * S * 0.35;
      const a = Math.max(0, 1 - since / 1.6);
      if (a <= 0) continue;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(c.rot + since * 6); ctx.fillStyle = c.c;
      const s = c.s * S;
      if (c.sh === 0) ctx.fillRect(-s / 2, -s / 4, s, s / 2); else { ctx.beginPath(); ctx.arc(0, 0, s / 2.4, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }
  // vignette
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.4, S / 2, S / 2, S * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(20,40,110,0.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
};
document.fonts.load(`100px Lilita`).then(() => { window.renderAt(3.0); document.title = 'ready'; });
</script>
</body>
</html>
